name: php 8.5 Fitness Functions

on:
  push:
    branches:
      - 'main'
  schedule:
    - cron:  '15 10 * * *' # each day at 10:15 UTC


jobs:
  configured-alpine-is-latest-version:
    name: "Ensure that Alpine 3.24 is the latest alpine version"
    env:
      LATEST_ALPINE_RELEASE: "3.24.1"
    runs-on: ubuntu-latest
    steps:
      -  name: Execute
         run: >
             docker run --pull always --rm alpine:3.24 cat /etc/os-release | grep $LATEST_ALPINE_RELEASE

  php85-is-the-default-php-on-alpine-324:
    name: "Ensure PHP 8.5 is the default PHP on Alpine 3.24"
    runs-on: ubuntu-latest
    steps:
      -  name: Execute
         run: >
             docker run --pull always --rm alpine:3.24 sh -c 'apk add -U php85 && php -v | grep -q "^PHP 8.5\."'
